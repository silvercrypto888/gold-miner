[package]
name = "gold-miner"
version = "0.2.0"
description = "Gold Miner v2 - Bitmap grid on X1"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "gold_miner"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022", "metadata"] }
